# GENERATED by scripts/cms-config.mjs from src/content/*.json — do not edit by hand.
# Run "npm run cms:config" after adding content files or fields.
# Pages CMS (https://app.pagescms.org): editor for people without a GitHub account.
media:
  input: "public/media/uploads"
  output: "/media/uploads"
  rename: "safe"
  categories:
    - "image"
    - "document"
settings:
  commit:
    identity: "user"
content:
  - name: "news-posts"
    label: "In the news (articles about LDII, with \"Read more\")"
    type: "file"
    path: "src/content/news-posts.json"
    format: "json"
    description: "Shown on the home page and the News page. The first item is the large one on the home page."
    fields:
      - name: "items"
        label: "Articles"
        type: "object"
        list: true
        fields:
          - name: "slug"
            label: "Web address name"
            description: "Lowercase words joined by dashes, e.g. youth-forum-2027. It becomes part of the page address: never change it after publishing."
            type: "string"
          - name: "date"
            label: "Date"
            description: "For events: year-month-day (2027-06-01). It decides whether the event is upcoming or past."
            type: "date"
          - name: "displayDate"
            label: "Date as shown"
            description: "e.g. July 11–13, 2024"
            type: "string"
          - name: "source"
            label: "Published by"
            type: "string"
          - name: "sourceShort"
            label: "Publisher, short name"
            type: "string"
          - name: "sourceIcon"
            label: "Icon when there is no logo"
            type: "string"
          - name: "title"
            label: "Title"
            type: "text"
          - name: "excerpt"
            label: "Short introduction"
            type: "text"
          - name: "body"
            label: "Full text (opens with \"Read more\")"
            type: "text"
            list: true
          - name: "link"
            label: "Link to the original"
            description: "Full https:// address, or a page like /events/gallery."
            type: "text"
          - name: "linkLabel"
            label: "Link text"
            type: "string"
          - name: "image"
            label: "Picture"
            description: "JPG or PNG, landscape, under 2 MB. Choose it for what it shows."
            type: "image"
          - name: "imageAlt"
            label: "Picture description (for blind visitors and social apps)"
            type: "text"
          - name: "logo"
            label: "Logo"
            description: "The organisation’s real logo only (PNG or SVG)."
            type: "image"
          - name: "video"
            label: "Show the parade film instead of a picture"
            type: "boolean"
  - name: "news"
    label: "LDII updates (short news cards)"
    type: "file"
    path: "src/content/news.json"
    format: "json"
    fields:
      - name: "items"
