# LDII Content Manager — Sveltia CMS (free, open source, Git based)
# ------------------------------------------------------------------
# IMPORTANT: replace "ldiinitiatives/ldii-website" with your own GitHub
# repository (owner/repo) before using the panel. The repository must
# contain this website, and the branch below must be the branch you deploy.
# ------------------------------------------------------------------

backend:
  name: github
  repo: ldiinitiatives/ldii-website
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

# Local development (optional). `npm run dev` + `npx @sveltia/cms-proxy-server`
local_backend: false

site_url: https://ldiinitiatives.org
display_url: https://ldiinitiatives.org
logo_url: https://res.cloudinary.com/dzppzxpad/image/upload/q_auto/f_auto/v1781702619/Circular_LDII_bewv0j.png

publish_mode: simple

media_folder: public/media/uploads
public_folder: /media/uploads

collections:
  - name: news
    label: News & Press Releases
    label_singular: News Item
    folder: public/content/news
    create: true
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { name: category, label: Category, widget: select, options: [News, Press Release, Research, Partnership, Event Report] }
      - { name: excerpt, label: Short summary, widget: text, required: false }
      - { name: image, label: Image, widget: image, required: false }
      - { name: body, label: Full article, widget: markdown, required: false }

  - name: events
    label: Events
    label_singular: Event
    folder: public/content/events
    create: true
    slug: '{{slug}}'
    summary: '{{title}} — {{date}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Event title, widget: string }
      - { name: date, label: Event date, widget: datetime, date_format: YYYY-MM-DD, time_format: false }
      - { name: type, label: Type, widget: select, options: [Conference, Workshop, Summit, Community Event, Webinar] }
      - { name: location, label: Location, widget: string }
      - { name: description, label: Description, widget: text }
      - { name: image, label: Image, widget: image, required: false }
      - { name: registration_link, label: Registration link, widget: string, required: false }

  - name: testimonials
    label: Testimonials
    label_singular: Testimonial
    folder: public/content/testimonials
    create: true
    slug: '{{slug}}'
    summary: '{{name}} — {{role}}'
    fields:
      - { name: name, label: Name, widget: string }
      - { name: role, label: Role and organisation, widget: string }
      - { name: quote, label: Quote, widget: text }
      - { name: photo, label: Photo, widget: image, required: false }

  - name: focus_areas
    label: Focus Areas
    label_singular: Focus Area
    folder: public/content/focus-areas
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Short summary, widget: text }
      - { name: icon, label: Icon (Remix Icon class, e.g. ri-leaf-line), widget: string, required: false }
      - { name: body, label: Details, widget: markdown, required: false }

  - name: site
    label: Site Settings
    files:
      - name: contact
        label: Contact Details
        file: public/content/settings/contact.json
        fields:
          - { name: primary_email, label: Primary email, widget: string, default: info@ldiinitiatives.org }
          - { name: secondary_email, label: Second official email, widget: string, default: admin@ldiinitiatives.org }
          - { name: phone, label: Phone, widget: string, default: '+1 647 656 3026' }
          - { name: toronto_address, label: Toronto office address, widget: string, default: '3701 Chesswood Drive, Unit 315, Toronto, ON M3J 2P6' }
      - name: newsletter
        label: Newsletter Text
        file: public/content/settings/newsletter.json
        fields:
          - { name: heading, label: Heading, widget: string }
          - { name: description, label: Description, widget: text }
          - { name: note, label: Small print, widget: string, required: false }