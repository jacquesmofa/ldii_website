name: Deploy LDII Website to HostPapa

on:
  push:
    branches:
      - main 

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗 Build Project
        run: npm run build 
        
      - name: 🔑 Add editor sign-in settings (secrets never go in the repo)
        env:
          CMS_GITHUB_CLIENT_ID: ${{ secrets.CMS_GITHUB_CLIENT_ID }}
          CMS_GITHUB_CLIENT_SECRET: ${{ secrets.CMS_GITHUB_CLIENT_SECRET }}
        run: |
          if [ -z "$CMS_GITHUB_CLIENT_ID" ] || [ -z "$CMS_GITHUB_CLIENT_SECRET" ]; then
            echo "Editor GitHub sign-in secrets not set; skipping (token sign-in still works)."
            exit 0
          fi
          node -e '
            const b64 = Buffer.from(JSON.stringify({
              client_id: process.env.CMS_GITHUB_CLIENT_ID,
              client_secret: process.env.CMS_GITHUB_CLIENT_SECRET,
            })).toString("base64");
            require("fs").writeFileSync("out/api/oauth-config.php",
              "<?php\nreturn json_decode(base64_decode(\x27" + b64 + "\x27), true);\n");
          '
          echo "Editor sign-in settings written."

      - name: 📂 Deploy 'out' folder contents to HostPapa
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.HOSTPAPA_HOST }} 
          username: ${{ secrets.HOSTPAPA_USERNAME }}
          password: ${{ secrets.HOSTPAPA_PASSWORD }}
          port: 21
          secure: false
          local-dir: out/
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            src/** out/**